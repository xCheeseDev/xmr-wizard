name: Node health check

on:
  schedule:
    - cron: "17 * * * *"  # hourly
  workflow_dispatch:      # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check node health
        run: python3 scripts/health_check.py
      - name: Commit status.json
        run: |
          git config user.name "xmr-wizard-health"
          git config user.email "xmr-wizard-health@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Hourly node health check"
          git push
